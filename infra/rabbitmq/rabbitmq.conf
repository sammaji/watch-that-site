# rabbitmq/rabbitmq.conf
# Load definitions on startup (queues, exchanges, vhosts)
load_definitions = /tmp/definitions.json

# Memory — RabbitMQ will start throttling producers at 40% of its container limit
vm_memory_high_watermark.relative = 0.4

# Disk — block publishers if free disk drops below this
disk_free_limit.absolute = 2GB

# Heartbeat — catches dead TCP connections faster
heartbeat = 60

# Slightly tighter channel limit per connection (default is unlimited)
channel_max = 128

# Logging
log.console = true
log.console.level = warning

packages:
    - "apps/*"
    - "packages/*"
    - "services/*"
    - "tests"

# packages/cloudflare needs these to build their native/platform binaries.
# Without the allowlist pnpm skips the postinstall and wrangler cannot run.
onlyBuiltDependencies:
    - esbuild
    - workerd

# mdast-util-to-markdown >=2.1.3 serializes strong/emphasis through a `handler.attention`
# property. fumadocs-core 16.9's stringifier (used by includeProcessedMarkdown in
# apps/docs) wraps every handler and drops that property, so any `**bold**` text
# recurses forever ("Maximum call stack size exceeded"). Remove once fumadocs is upgraded.
overrides:
    mdast-util-to-markdown: 2.1.2
